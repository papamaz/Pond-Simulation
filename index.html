<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pond graph</title>
<style>
:root{--bg:#f4f5f2;--side:#fff;--plot:#fff;--ink:#1d2a24;--mute:#6a786f;--line:#e1e6e1;--water:#4aa0c4;--water2:#1f6f94;--err:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1511;--side:#16221c;--plot:#0f1a15;--ink:#e6efe9;--mute:#98ada1;--line:#25362d;--water:#2f86ab;--water2:#7cc4e2;--err:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1511;--side:#16221c;--plot:#0f1a15;--ink:#e6efe9;--mute:#98ada1;--line:#25362d;--water:#2f86ab;--water2:#7cc4e2;--err:#ff8a7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1060px;margin:0 auto;padding:12px}
h1{font:600 1.35rem Georgia,serif;margin:4px 0 10px}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:780px){.app{grid-template-columns:1fr}.plot{order:-1}}
.side,.plot{background:var(--side);border:1px solid var(--line);border-radius:8px;padding:10px}
.r{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.f{flex:1;min-width:0}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid;padding:0;margin-top:5px;cursor:pointer;flex:none}
.x{border:0;background:none;color:var(--mute);font-size:1.3rem;line-height:1;cursor:pointer;padding:4px;margin-top:2px}
input[type=text],input[type=number]{font:15px ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--plot);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%;box-sizing:border-box}
input[type=number]{width:5.5em}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--water2);outline-offset:2px}
.er{color:var(--err);font-size:.82rem;min-height:0}
.btn{font-size:14px;color:var(--ink);background:var(--plot);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.btn:hover{border-color:var(--water2)}
.sl{display:flex;gap:8px;align-items:center;margin-top:8px}.sl label{width:2.2em;font-family:ui-monospace,monospace}.sl input[type=range]{flex:1;min-width:0}
.hint{color:var(--mute);font-size:.85rem;margin:12px 0 0}code{font-family:ui-monospace,Menlo,monospace;font-size:.92em}
canvas{width:100%;height:auto;display:block;border-radius:4px;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;color:var(--mute);font-size:.88rem}
</style>
</head>
<body>
<main>
<h1>Pond graph</h1>
<div class="app">
<section class="side">
<div id="list"></div>
<button class="btn" id="add">Add expression</button>
<div id="sl"></div>
<p class="hint">Try <code>y = 0.5x + 3</code>, a circle <code>(x-10)^2 + (y-10)^2 = 9</code>, a shaded region <code>y &lt; 8</code>, or a point <code>(4, 7)</code>. Add <code>{0 &lt; x &lt; 10}</code> to limit where a graph is drawn. Letters other than x, y and e become sliders. Drag to pan, scroll to zoom.</p>
</section>
<section class="plot">
<canvas id="cv" width="800" height="800" aria-label="Graph with a pond-shaped blob"></canvas>
<div class="bar"><span id="coord">x = 0, y = 0</span><span><button class="btn" id="zi" aria-label="Zoom in">+</button> <button class="btn" id="zo" aria-label="Zoom out">−</button> <button class="btn" id="rs">Reset view</button></span></div>
</section>
</div>
</main>
