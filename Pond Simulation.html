<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pond graph</title>
<style>
:root{--bg:#f4f5f2;--side:#fff;--plot:#fff;--ink:#1d2a24;--mute:#6a786f;--line:#e1e6e1;--water:#4aa0c4;--water2:#1f6f94;--err:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1511;--side:#16221c;--plot:#0f1a15;--ink:#e6efe9;--mute:#98ada1;--line:#25362d;--water:#2f86ab;--water2:#7cc4e2;--err:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1511;--side:#16221c;--plot:#0f1a15;--ink:#e6efe9;--mute:#98ada1;--line:#25362d;--water:#2f86ab;--water2:#7cc4e2;--err:#ff8a7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1060px;margin:0 auto;padding:12px}
h1{font:600 1.35rem Georgia,serif;margin:4px 0 10px}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:780px){.app{grid-template-columns:1fr}.plot{order:-1}}
.side,.plot{background:var(--side);border:1px solid var(--line);border-radius:8px;padding:10px}
.r{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.f{flex:1;min-width:0}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid;padding:0;margin-top:5px;cursor:pointer;flex:none}
.x{border:0;background:none;color:var(--mute);font-size:1.3rem;line-height:1;cursor:pointer;padding:4px;margin-top:2px}
input[type=text],input[type=number]{font:15px ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--plot);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%;box-sizing:border-box}
input[type=number]{width:5.5em}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--water2);outline-offset:2px}
.er{color:var(--err);font-size:.82rem;min-height:0}
.btn{font-size:14px;color:var(--ink);background:var(--plot);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.btn:hover{border-color:var(--water2)}
.sl{display:flex;gap:8px;align-items:center;margin-top:8px}.sl label{width:2.2em;font-family:ui-monospace,monospace}.sl input[type=range]{flex:1;min-width:0}
.hint{color:var(--mute);font-size:.85rem;margin:12px 0 0}code{font-family:ui-monospace,Menlo,monospace;font-size:.92em}
canvas{width:100%;height:auto;display:block;border-radius:4px;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;color:var(--mute);font-size:.88rem}
</style>
</head>
<body>
<main>
<h1>Pond graph</h1>
<div class="app">
<section class="side">
<div id="list"></div>
<button class="btn" id="add">Add expression</button>
<div id="sl"></div>
<p class="hint">Try <code>y = 0.5x + 3</code>, a circle <code>(x-10)^2 + (y-10)^2 = 9</code>, a shaded region <code>y &lt; 8</code>, or a point <code>(4, 7)</code>. Add <code>{0 &lt; x &lt; 10}</code> to limit where a graph is drawn. Letters other than x, y and e become sliders. Drag to pan, scroll to zoom.</p>
</section>
<section class="plot">
<canvas id="cv" width="800" height="800" aria-label="Graph with a pond-shaped blob"></canvas>
<div class="bar"><span id="coord">x = 0, y = 0</span><span><button class="btn" id="zi" aria-label="Zoom in">+</button> <button class="btn" id="zo" aria-label="Zoom out">−</button> <button class="btn" id="rs">Reset view</button></span></div>
</section>
</div>
</main>
<script>
(function(){
var N=800,M=400,cv=document.getElementById('cv'),ctx=cv.getContext('2d'),off=document.createElement('canvas'),octx;
off.width=off.height=M;octx=off.getContext('2d');
var cx=10,cy=10,span=24,P={},used={},rows=[],cc=0,sliderKey='',pend=false;
var COL=['#c74440','#2d70b3','#388c46','#6042a6','#fa7e19','#d1228b'];
var FN={sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,sqrt:Math.sqrt,abs:Math.abs,exp:Math.exp,ln:Math.log,log:Math.log10,floor:Math.floor,ceil:Math.ceil,sign:Math.sign,round:Math.round};
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var pond={pt:function(t){return[8+6*Math.cos(t),8+1.5*Math.cos(t)+4*Math.sin(t)+Math.sin(2*t)]},
g:function(x,y){var u=(x-8)/6,s=Math.sqrt(1-u*u);return Math.abs(y-8-1.5*u)-s*(4+2*u)}};

function tok(s){var t=[],i=0,m,r;s=s.replace(/\s+/g,'');
while(i<s.length){r=s.slice(i);
if(m=r.match(/^(\d+\.?\d*|\.\d+)/)){t.push({k:'n',v:m[1]});i+=m[1].length}
else if(m=r.match(/^(asin|acos|atan|sin|cos|tan|sqrt|abs|exp|ln|log|floor|ceil|sign|round)/)){t.push({k:'f',v:m[1]});i+=m[1].length}
else if(r.slice(0,2)==='pi'){t.push({k:'n',v:String(Math.PI)});i+=2}
else if(m=r.match(/^[a-z]/)){t.push({k:'v',v:m[0]});i++}
else if(m=r.match(/^(<=|>=|<|>|=)/)){t.push({k:'r',v:m[1]});i+=m[1].length}
else if('+-*/^(),'.indexOf(r[0])>=0){t.push({k:'o',v:r[0]});i++}
else throw new Error('Can’t read “'+r[0]+'”')}
return t}
function Parser(t){this.t=t;this.i=0}
Parser.prototype={
is:function(v){var a=this.t[this.i];return !!a&&a.k==='o'&&a.v===v},
expr:function(){var a=this.term();while(this.is('+')||this.is('-')){var o=this.t[this.i++].v;a='('+a+o+this.term()+')'}return a},
term:function(){var a=this.unary();for(;;){var q=this.t[this.i],o;if(!q)break;
if(this.is('*')||this.is('/')){o=this.t[this.i++].v}
else if(q.k==='n'||q.k==='f'||q.k==='v'||this.is('(')){o='*'}
else break;
a='('+a+o+this.unary()+')'}return a},
unary:function(){if(this.is('-')){this.i++;return '(-'+this.unary()+')'}if(this.is('+')){this.i++;return this.unary()}return this.pow()},
pow:function(){var b=this.atom();if(this.is('^')){this.i++;return 'Math.pow('+b+','+this.unary()+')'}return b},
atom:function(){var q=this.t[this.i++];if(!q)throw new Error('The expression is incomplete');
if(q.k==='n')return '('+q.v+')';
if(q.k==='v'){if(q.v==='x'||q.v==='y')return q.v;if(q.v==='e')return 'Math.E';if(!(q.v in P))P[q.v]=1;used[q.v]=1;return 'P.'+q.v}
if(q.k==='f'){var a=this.is('(')?this.atom():this.pow();return 'F.'+q.v+'('+a+')'}
if(q.k==='o'&&q.v==='('){var e=this.expr();if(!this.is(')'))throw new Error('Missing )');this.i++;return '('+e+')'}
throw new Error('Unexpected “'+q.v+'”')}
};
function seg(tk){if(!tk.length)throw new Error('Something is missing next to the sign');var p=new Parser(tk),c=p.expr();
if(p.i<tk.length)throw new Error('Unexpected “'+tk[p.i].v+'”');return c}
function fn(code){return new Function('x','y','P','F','return '+code)}
function parse(str,isCond){
var tk=tok(str),i,depth=0,commas=[],rels=[],cd=[];
for(i=0;i<tk.length;i++){var q=tk[i];
if(q.k==='o'){if(q.v==='(')depth++;else if(q.v===')')depth--;else if(q.v===','){commas.push(i);cd.push(depth)}}
else if(q.k==='r')rels.push(i)}
if(commas.length){
if(isCond||rels.length||commas.length>1||cd[0]!==1||tk[0].v!=='('||tk[tk.length-1].v!==')')throw new Error('Points look like (3, 4)');
return{type:'pt',fx:fn(seg(tk.slice(1,commas[0]))),fy:fn(seg(tk.slice(commas[0]+1,-1)))}}
var parts=[],ops=[],s=0;
for(i=0;i<tk.length;i++)if(tk[i].k==='r'){parts.push(seg(tk.slice(s,i)));ops.push(tk[i].v);s=i+1}
parts.push(seg(tk.slice(s)));
if(!ops.length){if(isCond)throw new Error('A condition needs <, > or =');parts=['y',parts[0]];ops=['=']}
var eq=ops.indexOf('=')>=0;
if(eq){if(ops.length>1||isCond)throw new Error('Use only one = per line');return{type:'eq',f:fn('('+parts[0]+')-('+parts[1]+')')}}
return{type:'ineq',f:fn(ops.map(function(o,j){return '('+parts[j]+o+parts[j+1]+')'}).join('&&'))}}
function compile(raw){
raw=raw.toLowerCase().replace(/[×·]/g,'*').replace(/−/g,'-').replace(/π/g,'pi').replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/²/g,'^2').replace(/³/g,'^3');
var cond=null,m=raw.match(/\{([^{}]*)\}\s*$/);
if(m){raw=raw.slice(0,m.index);cond=parse(m[1],true).f}
if(!raw.trim())return null;
var o=parse(raw,false);o.cond=cond;return o}

function px(x){return(x-cx)/span*N+N/2}
function py(y){return N/2-(y-cy)/span*N}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function nice(){var raw=span/9,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*p}
function hex(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function lab(g){return String(+g.toFixed(6))}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
var pts=[];
function add(v1,v2,x1,y1,x2,y2){if((v1<0)!==(v2<0)&&isFinite(v1)&&isFinite(v2)&&Math.abs(v1-v2)<1e3){var t=v1/(v1-v2);pts.push(x1+(x2-x1)*t,y1+(y2-y1)*t)}}
function contour(f,cond,col){
var G=240,sp=span/G,x0=cx-span/2,y0=cy-span/2,prev=new Float64Array(G+1),cur=new Float64Array(G+1),i,j,t,segs=[];
function row(j,arr){var y=y0+j*sp;for(var i=0;i<=G;i++)arr[i]=f(x0+i*sp,y,P,FN)}
function line(k){var ax=pts[k],ay=pts[k+1],bx=pts[k+2],by=pts[k+3];
if(cond&&!cond((ax+bx)/2,(ay+by)/2,P,FN))return;segs.push([ax,ay,bx,by]);ctx.moveTo(px(ax),py(ay));ctx.lineTo(px(bx),py(by))}
ctx.strokeStyle=col;ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();row(0,prev);
for(j=0;j<G;j++){row(j+1,cur);var ya=y0+j*sp;
for(i=0;i<G;i++){var a=prev[i],b=prev[i+1],c=cur[i+1],d=cur[i],xa=x0+i*sp;pts.length=0;
add(a,b,xa,ya,xa+sp,ya);add(b,c,xa+sp,ya,xa+sp,ya+sp);add(d,c,xa,ya+sp,xa+sp,ya+sp);add(a,d,xa,ya,xa,ya+sp);
if(pts.length===4)line(0);else if(pts.length===8){line(0);line(4)}}
t=prev;prev=cur;cur=t}
ctx.stroke();return segs}
function shade(f,cond,col){
var id=octx.createImageData(M,M),d=id.data,rgb=hex(col),x0=cx-span/2,y1=cy+span/2;
for(var j=0;j<M;j++){var y=y1-(j+.5)/M*span;for(var i=0;i<M;i++){var x=x0+(i+.5)/M*span;
if(f(x,y,P,FN)&&(!cond||cond(x,y,P,FN))){var o=(j*M+i)*4;d[o]=rgb[0];d[o+1]=rgb[1];d[o+2]=rgb[2];d[o+3]=75}}}
octx.putImageData(id,0,0);ctx.drawImage(off,0,0,N,N)}
function draw(){
var mu=css('--mute'),ln=css('--line'),bg=css('--plot'),w=css('--water'),w2=css('--water2'),g,x0=cx-span/2,x1=cx+span/2,y0=cy-span/2,y1=cy+span/2,st=nice();
ctx.fillStyle=bg;ctx.fillRect(0,0,N,N);
ctx.lineWidth=1;ctx.strokeStyle=ln;ctx.beginPath();
for(g=Math.ceil(x0/st)*st;g<=x1;g+=st){ctx.moveTo(px(g),0);ctx.lineTo(px(g),N)}
for(g=Math.ceil(y0/st)*st;g<=y1;g+=st){ctx.moveTo(0,py(g));ctx.lineTo(N,py(g))}
ctx.stroke();
ctx.strokeStyle=mu;ctx.lineWidth=2;ctx.beginPath();
if(y0<=0&&y1>=0){ctx.moveTo(0,py(0));ctx.lineTo(N,py(0))}
if(x0<=0&&x1>=0){ctx.moveTo(px(0),0);ctx.lineTo(px(0),N)}
ctx.stroke();
ctx.fillStyle=mu;ctx.font='14px system-ui,sans-serif';
ctx.textAlign='center';var ty=clamp(py(0)+17,16,N-6);
for(g=Math.ceil(x0/st)*st;g<=x1;g+=st){if(Math.abs(g)>st/2)ctx.fillText(lab(g),px(g),ty)}
ctx.textAlign='right';var tx=clamp(px(0)-6,34,N-4);
for(g=Math.ceil(y0/st)*st;g<=y1;g+=st){if(Math.abs(g)>st/2)ctx.fillText(lab(g),tx,py(g)+5)}
ctx.beginPath();
for(var i=0;i<=360;i++){var bq=pond.pt(i*Math.PI/180);i?ctx.lineTo(px(bq[0]),py(bq[1])):ctx.moveTo(px(bq[0]),py(bq[1]))}
ctx.closePath();ctx.globalAlpha=.55;ctx.fillStyle=w;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=w2;ctx.lineWidth=2;ctx.stroke();
rows.forEach(function(r){if(r.hid||!r.o||r.o.type!=='ineq')return;try{shade(r.o.f,r.o.cond,r.col)}catch(e){}});
rows.forEach(function(r){if(r.hid||!r.o)return;var o=r.o;
o.segs=null;try{if(o.type==='eq')o.segs=contour(o.f,o.cond,r.col);
else if(o.type==='pt'){var X=o.fx(0,0,P,FN),Y=o.fy(0,0,P,FN);if(isFinite(X)&&isFinite(Y)){ctx.beginPath();ctx.arc(px(X),py(Y),7,0,6.2832);ctx.fillStyle=r.col;ctx.fill();ctx.strokeStyle=bg;ctx.lineWidth=2;ctx.stroke()}}}catch(e){}});marks()}
function marks(){
var eqs=rows.filter(function(r){return !r.hid&&r.o&&r.o.type==='eq'&&r.o.segs}),found=[],sp=span/240,ink=css('--ink'),bg=css('--plot');
var bs=[],bp=null;for(var m=0;m<=720;m++){var bq=pond.pt(m*Math.PI/360);if(bp)bs.push([bp[0],bp[1],bq[0],bq[1]]);bp=bq}
eqs.push({o:{segs:bs,cond:null,f:function(x,y){return pond.g(x,y)}}});
function solve(f,g,x,y){var h=sp*.01,k;for(k=0;k<6;k++){var a=f(x,y,P,FN),b=g(x,y,P,FN),fx=(f(x+h,y,P,FN)-a)/h,fy=(f(x,y+h,P,FN)-a)/h,gx=(g(x+h,y,P,FN)-b)/h,gy=(g(x,y+h,P,FN)-b)/h,D=fx*gy-fy*gx;if(!isFinite(D)||Math.abs(D)<1e-12)break;var nx=x-(gy*a-fy*b)/D,ny=y-(fx*b-gx*a)/D;if(!isFinite(nx)||!isFinite(ny)||Math.hypot(nx-x,ny-y)>3*sp)break;x=nx;y=ny}return[x,y]}
for(var i=0;i<eqs.length;i++)for(var j=i+1;j<eqs.length;j++){var A=eqs[i].o,B=eqs[j].o;
A.segs.forEach(function(s){B.segs.forEach(function(q){
if(found.length>=40)return;
var d=(s[2]-s[0])*(q[3]-q[1])-(s[3]-s[1])*(q[2]-q[0]);if(!d)return;
var t=((q[0]-s[0])*(q[3]-q[1])-(q[1]-s[1])*(q[2]-q[0]))/d,u=((q[0]-s[0])*(s[3]-s[1])-(q[1]-s[1])*(s[2]-s[0]))/d;
if(t<0||t>1||u<0||u>1)return;
var p=solve(A.f,B.f,s[0]+t*(s[2]-s[0]),s[1]+t*(s[3]-s[1]));
if((A.cond&&!A.cond(p[0],p[1],P,FN))||(B.cond&&!B.cond(p[0],p[1],P,FN)))return;
if(found.some(function(o){return Math.hypot(o[0]-p[0],o[1]-p[1])<sp*2}))return;
found.push(p)})})}
ctx.font='bold 14px system-ui,sans-serif';ctx.textAlign='left';ctx.lineJoin='round';
found.forEach(function(p){var X=px(p[0]),Y=py(p[1]);if(X<0||X>N||Y<0||Y>N)return;
ctx.beginPath();ctx.arc(X,Y,6,0,6.2832);ctx.fillStyle=bg;ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=2.5;ctx.stroke();
var txt='('+(+p[0].toFixed(2))+', '+(+p[1].toFixed(2))+')';
ctx.lineWidth=4;ctx.strokeStyle=bg;ctx.strokeText(txt,X+10,Y-10);ctx.fillStyle=ink;ctx.fillText(txt,X+10,Y-10)})}
function sched(){if(pend)return;pend=true;requestAnimationFrame(function(){pend=false;run()})}
function run(){used={};
rows.forEach(function(r){r.o=null;var m='';try{r.o=compile(r.inp.value)}catch(e){m=e.message}r.erEl.textContent=m});
syncSliders();draw()}
function syncSliders(){var ks=Object.keys(used).sort(),key=ks.join(',');if(key===sliderKey)return;sliderKey=key;
var box=document.getElementById('sl');box.innerHTML='';
ks.forEach(function(k){var d=document.createElement('div');d.className='sl';
d.innerHTML='<label>'+k+' =</label><input type="range" min="-10" max="10" step="0.1" aria-label="Slider '+k+'"><input type="number" step="0.1" aria-label="Value of '+k+'">';
var rg=d.children[1],nb=d.children[2];rg.value=nb.value=P[k];
rg.oninput=function(){P[k]=+rg.value;nb.value=rg.value;draw()};
nb.oninput=function(){var v=parseFloat(nb.value);if(isFinite(v)){P[k]=v;rg.value=v;draw()}};
box.appendChild(d)})}
function addRow(){var col=COL[cc++%COL.length],d=document.createElement('div');d.className='r';
d.innerHTML='<button class="sw" title="Show or hide" aria-label="Show or hide this graph"></button><div class="f"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="y = …" aria-label="Expression"><div class="er" role="status"></div></div><button class="x" title="Remove" aria-label="Remove expression">×</button>';
var r={col:col,hid:false,sw:d.children[0],inp:d.querySelector('input'),erEl:d.querySelector('.er'),o:null};
r.sw.style.background=col;r.sw.style.borderColor=col;
r.sw.onclick=function(){r.hid=!r.hid;r.sw.style.background=r.hid?'transparent':col;draw()};
r.inp.oninput=sched;
r.inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();addRow().inp.focus()}};
d.children[2].onclick=function(){if(rows.length===1){r.inp.value='';sched();return}rows.splice(rows.indexOf(r),1);d.remove();sched()};
document.getElementById('list').appendChild(d);rows.push(r);return r}
document.getElementById('add').onclick=function(){addRow().inp.focus()};
document.getElementById('zi').onclick=function(){span=Math.max(.5,span*.7);draw()};
document.getElementById('zo').onclick=function(){span=Math.min(400,span/.7);draw()};
document.getElementById('rs').onclick=function(){cx=cy=10;span=24;draw()};
var drag=null;
cv.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY,cx:cx,cy:cy};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',function(){drag=null});
cv.addEventListener('pointermove',function(e){var r=cv.getBoundingClientRect();
if(drag){cx=drag.cx-(e.clientX-drag.x)/r.width*span;cy=drag.cy+(e.clientY-drag.y)/r.height*span;draw()}
document.getElementById('coord').textContent='x = '+(cx+((e.clientX-r.left)/r.width-.5)*span).toFixed(1)+', y = '+(cy-((e.clientY-r.top)/r.height-.5)*span).toFixed(1)});
cv.addEventListener('wheel',function(e){e.preventDefault();var r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width-.5,my=(e.clientY-r.top)/r.height-.5,
wx=cx+mx*span,wy=cy-my*span;span=clamp(span*Math.exp(e.deltaY*.0015),.5,400);cx=wx-mx*span;cy=wy+my*span;draw()},{passive:false});
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
addRow();run();
})();
</script>
</body>
</html>
